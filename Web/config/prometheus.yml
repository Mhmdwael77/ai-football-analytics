global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Scrape metrics exported by the OpenTelemetry Collector
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Scrape metrics directly from the backend server
  - job_name: "trakora-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:4000"]
